[package]
name = "pooplog"
version = "0.1.1-beta"
description = "PoopLog - privacy-first bowel movement tracker"
authors = ["PoopLog"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "pooplog_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
